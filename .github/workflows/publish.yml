name: Publish

# Publishes @cubric/ui to npm when package.json version changes on main.
# Bump the version in your PR; merging it triggers the publish. Merges without a
# version bump are a no-op.

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Publish if version is new
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cubric/ui version 2>/dev/null || echo "0.0.0")
          if [ "$PKG_VERSION" != "$PUBLISHED" ]; then
            echo "Publishing @cubric/ui@$PKG_VERSION (was $PUBLISHED)"
            npm publish --access public --provenance
          else
            echo "Version $PKG_VERSION already published — skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
